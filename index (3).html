<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hello World Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --tg-theme-bg-color: #ffffff;
    --tg-theme-text-color: #000000;
    --tg-theme-button-color: #2481cc;
    --tg-theme-button-text-color: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color);
    color: var(--tg-theme-text-color);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 8px;
  }
  p.subtitle {
    opacity: 0.6;
    margin-bottom: 32px;
    font-size: 15px;
  }
  #score {
    font-size: 64px;
    font-weight: 700;
    margin-bottom: 32px;
    transition: transform 0.1s ease;
  }
  #score.bump {
    transform: scale(1.15);
  }
  button {
    background: var(--tg-theme-button-color);
    color: var(--tg-theme-button-text-color);
    border: none;
    border-radius: 14px;
    padding: 18px 40px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    max-width: 300px;
  }
  button:active {
    opacity: 0.8;
  }
  #userinfo {
    margin-top: 24px;
    font-size: 13px;
    opacity: 0.5;
  }
</style>
</head>
<body>
  <h1>👋 Hello World!</h1>
  <p class="subtitle">Твоя первая Telegram-игра</p>

  <div id="score">0</div>
  <button id="tapBtn">Тапни меня</button>

  <div id="userinfo">Загрузка данных пользователя...</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand(); // раскрыть приложение на весь экран

  let score = 0;
  const scoreEl = document.getElementById('score');
  const btn = document.getElementById('tapBtn');
  const userInfoEl = document.getElementById('userinfo');

  // Показываем имя пользователя, если Telegram передал данные
  const user = tg.initDataUnsafe?.user;
  if (user) {
    userInfoEl.textContent = `Привет, ${user.first_name}!`;
  } else {
    userInfoEl.textContent = 'Открой это приложение через Telegram-бота';
  }

  btn.addEventListener('click', () => {
    score++;
    scoreEl.textContent = score;

    // маленькая анимация
    scoreEl.classList.add('bump');
    setTimeout(() => scoreEl.classList.remove('bump'), 100);

    // тактильный отклик (если поддерживается)
    if (tg.HapticFeedback) {
      tg.HapticFeedback.impactOccurred('light');
    }

    // после 10 тапов показываем кнопку "Готово" внизу
    if (score === 10) {
      tg.MainButton.setText('Отлично! Отправить результат');
      tg.MainButton.show();
      tg.MainButton.onClick(() => {
        tg.sendData(JSON.stringify({ score: score }));
        tg.close();
      });
    }
  });
</script>
</body>
</html>
